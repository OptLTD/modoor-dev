# Modoor app. Postgres is external (DATABASE_URL).
# Host 80, 443, and 8765 all reach the process on container port 8765.
# No certs: HTTP on that port. MODOOR_WEBUI_URL stays http://...
# TLS: put fullchain.pem and privkey.pem in ./certs (or MODOOR_SSL_DIR)
# and set MODOOR_WEBUI_URL=https://<host>. The app serves HTTPS and
# redirects plain HTTP to that URL.
# Do not mount the pem paths themselves; a missing file is created as a directory.

services:
  modoor:
    image: ${MODOOR_IMAGE:-optltd/modoor:lyghh}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MODOOR_WEBUI_URL: ${MODOOR_WEBUI_URL:-http://127.0.0.1:8765}
      MODOOR_STORAGE_ROOT: /data/storage
      MODOOR_PY_CACHE: /var/cache/modoor/py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:8765"
      - "443:8765"
      - "8765:8765"
    volumes:
      - ${MODOOR_SSL_DIR:-./certs}:/certs:ro
      - modoor-storage:/data/storage
      - modoor-pycache:/var/cache/modoor/py
    command:
      - python
      - -m
      - modoor.web.serve
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, ssl
          ctx = ssl._create_unverified_context()
          for url in ("https://127.0.0.1:8765/health", "http://127.0.0.1:8765/health"):
              try:
                  urllib.request.urlopen(url, context=ctx, timeout=3)
              except Exception:
                  continue
              raise SystemExit(0)
          raise SystemExit(1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  modoor-storage:
  modoor-pycache:
