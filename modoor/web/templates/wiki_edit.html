{% extends "base.html" %}
{% block title %}{% if page %}Edit{% else %}New{% endif %} Wiki · Modoor{% endblock %}
{% block content %}
  <h1>{% if page %}编辑页面{% else %}新建页面{% endif %}</h1>
  <form method="post" action="/wiki/save">
    {% if page %}<input type="hidden" name="page_id" value="{{ page.id }}" />{% endif %}
    <div class="form-grid">
      <label>Slug <input name="slug" value="{{ page.slug if page else '' }}" required /></label>
      <label>Title <input name="title" value="{{ page.title if page else '' }}" required /></label>
    </div>
    <label class="meta">Body (Markdown)
      <textarea name="body">{{ page.body if page else '' }}</textarea>
    </label>
    <p style="margin-top:1rem;">
      <button type="submit">Save</button>
      <a class="btn secondary" href="/wiki">Cancel</a>
    </p>
  </form>
{% endblock %}
