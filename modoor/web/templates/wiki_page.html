{% extends "base.html" %}
{% block title %}{{ page.title }} · Wiki{% endblock %}
{% block content %}
  <p class="meta">
    <a href="/wiki">← Wiki</a> · <code>{{ page.slug }}</code>
    · <a href="/wiki/{{ page.slug }}/edit">Edit</a>
  </p>
  <h1>{{ page.title }}</h1>
  <p class="meta">updated {{ page.updated_at }} · by {{ page.updated_by }}</p>
  <pre>{{ page.body }}</pre>
{% endblock %}
