services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: modoor
      POSTGRES_PASSWORD: modoor
      POSTGRES_DB: modoor
    ports:
      - "${MODOOR_PG_PORT:-5432}:5432"
    volumes:
      - modoor-pg:/var/lib/postgresql/data
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modoor -d modoor"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  modoor-pg:
