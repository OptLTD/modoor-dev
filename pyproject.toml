[project]
name = "modoor"
version = "0.1.0"
description = "AI capability layer: Module → Skill + MCP (Phase 0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "httpx>=0.27",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "xlrd>=1.2.0,<2",
  "olefile>=0.47",
  "pillow>=10.0",
  "rapidocr-onnxruntime>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
modoor-mcp = "modoor.runtime.mcp_server:main"
modoor-web = "modoor.web.app:main"
modoor-worker = "modoor.runtime.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modoor", "builtin", "addon", "external"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
  "modoor/tests",
  "addon/*/tests",
  "builtin/*/tests",
]
